[versions]
agp = "8.11.1"
autoService = "1.1.1"
coroutines = "1.11.0"
datastore = "1.2.1"
media3 = "1.10.1"
kotlin = "2.2.21"
ktor = "3.1.0"
wire = "5.5.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
squareup-wire = { id = "com.squareup.wire", version.ref = "wire" }

[libraries]
android-material = { group = "com.google.android.material", name = "material", version = "1.14.0" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.15.0" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
androidx-datastore-core = { group = "androidx.datastore", name = "datastore-core", version.ref = "datastore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.7.1" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
autoservice-annotation = { group = "com.google.auto.service", name = "auto-service-annotations", version.ref = "autoService" }
autoservice-processor = { group = "com.google.auto.service", name = "auto-service", version.ref = "autoService" }
google-gson = { group = "com.google.code.gson", name = "gson", version = "2.14.0" }
google-zxing-core = { group = "com.google.zxing", name = "core", version = "3.5.4" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty-jvm", version.ref = "ktor" }
ktor-tls = { group = "io.ktor", name = "ktor-network-tls-certificates", version.ref = "ktor" }
squareup-okhttp3 = { group = "com.squareup.okhttp3", name = "okhttp", version = "5.4.0" }
squareup-retrofit2 = { group = "com.squareup.retrofit2", name = "retrofit", version = "3.0.0" }

# Dependencies for gradle
android-gradle = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradle = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
squareup-wire-gradle = { group = "com.squareup.wire", name = "wire-gradle-plugin", version.ref = "wire" }
